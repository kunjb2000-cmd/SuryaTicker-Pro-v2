<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SuryaTicker Pro V2</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===========================
     CONTROL PANEL
=========================== -->

<div id="controlPanel">

<h2>SuryaTicker Pro V2</h2>

<div class="group">

<label>Label</label>

<input
type="text"
id="labelInput"
placeholder="BREAKING NEWS">

</div>

<div class="group">

<label>Scrolling Text</label>

<textarea
id="textInput"
rows="4"
placeholder="यहाँ अपना चलने वाला टेक्स्ट लिखें..."></textarea>

</div>

<div class="group">

<button id="applyBtn">
Apply
</button>

</div>

</div>

<!-- ===========================
     TICKER
=========================== -->

<div id="ticker">

<div id="breakingLabel">
BREAKING NEWS
</div>

<div id="tickerArea">

<div id="tickerText">

SuryaTicker Pro V2 Started Successfully

</div>

</div>

<div id="liveBox">

LIVE

</div>

</div>

<script src="app.js"></script>
<script src="rss.js"></script>

</body>

</html>
